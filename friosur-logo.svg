    <path d="M30 20 L70 20 L90 50 L110 50 L110 90 L90 90 L70 70 L50 70 L30 90 L10 90 L10 50 L30 20 Z"/>
    <!-- Base del icono -->
    <path d="M50 90 L90 90 L100 110 L40 110 Z"/>
  </g>
  
  <!-- Texto FRIOSUR - fuente bold sans-serif -->
  <text x="200" y="175" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="currentColor" letter-spacing="6">FRIOSUR</text>
  
  <!-- Texto AYSEN -->
  <text x="155" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="currentColor" letter-spacing="4">AYSEN</text>
  
  <!-- Icono de brújula circular -->
  <circle cx="200" cy="216" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M200 209 L202 214 L200 216 L198 214 Z" fill="currentColor"/>
  <path d="M200 223 L202 218 L200 216 L198 218 Z" fill="currentColor"/>
  <text x="200" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="currentColor">A</text>
  
  <!-- Texto PATAGONIA -->
  <text x="245" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="currentColor" letter-spacing="4">PATAGONIA</text>
</svg>